<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>enana</title>
    <style>
        
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      cursor: default;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .center-message {
      font-family: 'Courier New', monospace;
      color: #ff69b4;
      font-size: 3rem;
      text-align: center;
      opacity: 0.1;
    }
  
    </style>
</head>
<body>
    <canvas id="canvas" width="744" height="858"></canvas>
    <div class="overlay">
        <div class="center-message">TE AMO💖</div>
    </div>
    <script>
        
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Configurar tamaño del canvas
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const text = "TE AMO";
    const fontSize = 16;
    const columns = Math.floor(canvas.width / (fontSize * 4)); // Menos columnas porque "TE AMO" es más ancho
    const drops = new Array(columns).fill(1);

    ctx.font = fontSize + "px monospace";

    function draw() {
      // Fondo translúcido para efecto de desvanecimiento
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff69b4"; // Rosado amoroso
      for (let i = 0; i < drops.length; i++) {
        const x = i * fontSize * 4;
        const y = drops[i] * fontSize;
        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(draw, 100);

    // Redimensionar canvas si cambia el tamaño
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  
    </script>
</body>
</html>
